name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push-sidecar:
    name: Build & Push Sidecar Image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chaos-sidecar:latest
            ${{ secrets.DOCKER_USERNAME }}/chaos-sidecar:${{ steps.version.outputs.VERSION }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: production
    needs: build-and-push-sidecar
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
