services:
  exporter:
    image: python:3.12-slim
    working_dir: /workspace
    command: ["python", "/workspace/observability/exporter.py", "--port", "8000", "--log-path", "/observability/data/chaos-events.jsonl"]
    volumes:
      - ..:/workspace:ro
      - ./data:/observability/data
    ports:
      - "8000:8000"

  probe:
    build:
      context: ..
      dockerfile: observability/probe.Dockerfile
    network_mode: host
    pid: host
    cap_add:
      - NET_RAW
    environment:
      PROBE_TARGETS: ${PROBE_TARGETS:-victim}
    command: ["--port", "8001", "--interval", "2", "--count", "5", "--timeout", "1"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - exporter

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-admin-api
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - exporter
      - probe

  grafana:
    image: grafana/grafana-oss:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data: