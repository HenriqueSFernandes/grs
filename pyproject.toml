[project]
name = "network-chaos-tool"
version = "0.4.0"
description = "Programmable chaos engineering tool for Docker-based network topologies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Henrique S. Fernandes", email = "henriquesardofernandes@gmail.com"},
    {name = "Leandro S. Martins", email = "up202208001@up.pt"},
]
keywords = ["chaos-engineering", "docker", "network", "tc", "traffic-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "docker>=7.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
chaos = "injector.cli:main"
chaosctl = "injector.sidecar_runner:main"

[project.urls]
Homepage = "https://github.com/HenriqueSFernandes/grs"
Repository = "https://github.com/HenriqueSFernandes/grs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["injector"]

[tool.hatch.build.targets.wheel.force-include]
"Dockerfile" = "Dockerfile"
"pyproject.toml" = "pyproject.toml"
"README.md" = "README.md"
"injector/templates" = "injector/templates"
